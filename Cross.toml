# Rust's musl targets statically link libc by default (the crt-static target
# feature), and a statically-linked target cannot produce a cdylib — Rust
# refuses with "does not support these crate types" rather than emit a shared
# object that can't actually be dynamically loaded. napi-rs's addon is a
# cdylib, so the musl builds need crt-static turned off, which switches them
# to dynamically linking musl libc instead.
#
# `cross` does not forward arbitrary host environment variables into the
# build container, so RUSTFLAGS has to be listed explicitly here even though
# it is also set in the workflow step.
[target.x86_64-unknown-linux-musl.env]
passthrough = ["RUSTFLAGS"]

[target.aarch64-unknown-linux-musl.env]
passthrough = ["RUSTFLAGS"]
