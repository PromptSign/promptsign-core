# Build @promptsign/verify's native addon for every supported platform and
# publish the platform packages + the main package to npm, with provenance.
#
# Trigger by pushing a tag like `verify-v0.3.0` (or run manually). No secret is
# needed: publishing goes through npm trusted publishing, which authenticates
# this workflow by its OIDC identity. Bump versions with `npm run sync-versions`
# (in promptsign-napi) before tagging.
name: publish @promptsign/verify

on:
  push:
    tags: ['verify-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            linker: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            cross: true
          # Both darwin slices build on Apple silicon, the same fix applied to
          # promptsign-cli's release workflow: macos-13 is an Intel runner
          # image GitHub is retiring. stage-platform.mjs only copies the built
          # .node file rather than loading it, so nothing here needs to
          # execute a foreign-architecture binary.
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # musl targets build in a container via `cross` (bundles the musl
      # toolchains for both x64 and arm64); everything else uses plain cargo.
      - name: install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: build addon (cross)
        if: ${{ matrix.cross }}
        # musl targets statically link libc by default, and a cdylib can't be
        # produced for a statically-linked target. See Cross.toml for why
        # this also has to be passed through to the container.
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cross build --release -p promptsign-napi --target ${{ matrix.target }} --manifest-path Cargo.toml

      - name: build addon (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p promptsign-napi --target ${{ matrix.target }} --manifest-path Cargo.toml

      - name: stage into npm dir
        run: node promptsign-napi/scripts/stage-platform.mjs ${{ matrix.target }} ${{ matrix.platform }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: promptsign-napi/npm/${{ matrix.platform }}/promptsign-napi.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: download prebuilt binaries
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: place binaries into npm dirs
        working-directory: promptsign-napi
        run: |
          for p in linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 win32-x64-msvc; do
            cp "$GITHUB_WORKSPACE/artifacts/$p/promptsign-napi.node" "npm/$p/promptsign-napi.node"
          done

      # Published through npm trusted publishing, so there is no token anywhere:
      # the registry accepts the upload on the strength of this workflow's OIDC
      # identity, the same shape as the keyless signing this package exists to
      # verify. Provenance is generated automatically for a public package from
      # a public repository, so --provenance is not passed.
      #
      # Each of these eight packages has its own trusted publisher configured on
      # npmjs.com, naming this repository and this workflow file. Renaming the
      # file breaks publishing until they are updated.
      - name: publish platform packages
        working-directory: promptsign-napi
        run: |
          for p in linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 win32-x64-msvc; do
            npm publish "npm/$p" --access public
          done

      - name: publish main package
        working-directory: promptsign-napi
        run: npm publish --access public
