# Build and test the verifier core on every platform it ships to.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # promptsign-napi's build script wants a Node toolchain present.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # `cargo test` covers the Rust core but never loads the addon, so the binding's
  # own behaviour — platform resolution, the pinned trust root, and the Rekor log
  # id it is pinned to — went unchecked. This job builds the addon and runs the
  # Node tests against it. The parity tests skip here (they need a CLI built with
  # the local-key feature, which lives in a sibling repo); run them locally with
  # PROMPTSIGN_RUST_BIN before a release.
  napi:
    name: napi (node)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p promptsign-napi --locked

      - run: node promptsign-napi/scripts/copy-artifact.mjs

      - run: node --test
        working-directory: promptsign-napi

  # trust/ at the repo root is the canonical pinned Sigstore trust root;
  # promptsign-napi/trust/ is a committed copy of it, because npm publishes only
  # what is inside the package directory. The copy is what npm consumers
  # actually verify against, so letting it drift would anchor them to a root
  # nobody is maintaining.
  #
  # trust-root.test.mjs asserts this too, but that runs in the `napi` job behind
  # a release build on three runners. Drift is a two-file byte comparison and
  # should fail in seconds, on its own, so the message says what to do.
  trust:
    name: trust root copies in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node scripts/sync-trust.mjs --check

  # The napi binding's JS surface (published index.cjs, its test, and the build
  # helper scripts) has no other Node tooling, so prettier runs straight from a
  # pinned npx — no devDependency, no lockfile to keep in step.
  format:
    name: prettier (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npx prettier@3.9.6 --check "promptsign-napi/**/*.{mjs,cjs,ts}" "scripts/*.mjs"

  # The verifier core is a trust root: need a clean supply-chain.
  # Fail the build on a known-vulnerable or unmaintained dependency.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
