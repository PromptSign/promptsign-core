[package]
name = "promptsign-core"
description = "PromptSign core: canonicalization, bundle manifests, DSSE signing/verification, trust policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["signing", "sigstore", "provenance", "supply-chain", "verification"]
categories = ["cryptography", "development-tools"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
base64.workspace = true
unicode-normalization.workspace = true
# keyless verification (still fully offline: parse/verify stapled certs + log proofs)
x509-cert = { version = "0.3", features = ["pem"] }
der = "0.8"
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
# RSA chain links (enterprise CAs); verification only, no private-key operations
rsa = { version = "0.9", default-features = false, features = ["std"] }

[dev-dependencies]
x509-cert = { version = "0.3", features = ["pem", "builder"] }
# p256 0.14 needs the oid feature of its sha2 to name ECDSA in test certificates.
sha2-oid = { package = "sha2", version = "0.11", features = ["oid"] }
