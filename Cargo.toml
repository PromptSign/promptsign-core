[workspace]
members = ["promptsign-core", "promptsign-napi"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PromptSign/promptsign-core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
getrandom = "0.2"
base64 = "0.22"
unicode-normalization = "0.1"

# The verifier core (and its napi binding) build small and fast: napi ships as a
# cdylib to Node, promptsign-core is embedded elsewhere.
[profile.release]
lto = true
strip = true
codegen-units = 1
